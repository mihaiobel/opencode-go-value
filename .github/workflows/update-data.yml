name: update-data

on:
  schedule:
    # daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh data/latest.json
        run: python3 scripts/fetch_go.py --data data/latest.json > data/latest.json.tmp && mv data/latest.json.tmp data/latest.json

      - name: Validate JSON
        run: python3 -m json.tool data/latest.json > /dev/null

      - name: Commit on diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/latest.json; then
            echo "no changes in data/latest.json"
            exit 0
          fi
          asof="$(python3 -c 'import json;print(json.load(open("data/latest.json"))["meta"]["as_of"])')"
          git config user.name "opencode-go-value bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git commit -m "data: refresh Go plan catalog (as of ${asof})"
          git push
          # Pushes made with GITHUB_TOKEN do not trigger other workflows,
          # so start the Pages deploy explicitly.
          gh workflow run pages.yml
